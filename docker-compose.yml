services:
  backend:
    build: ./backend
    container_name: restaurant_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=supersecret        # matches the code's fallback; change for real use
      - CHOKIDAR_USEPOLLING=true       # reliable nodemon file-watching on Docker/macOS
    volumes:
      - ./backend:/app                 # source bind-mount -> hot reload + persists database.sqlite on host
      - /app/node_modules              # anonymous volume: keep the container's Linux-built node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: restaurant_frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true       # reliable Vite HMR file-watching on Docker/macOS
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
